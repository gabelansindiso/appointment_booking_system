spring.application.name=booking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USER:booking}
spring.datasource.password=${DB_PASSWORD:booking}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true

booking.min-lead-time=PT1H
booking.max-advance-days=60
booking.reschedule-cutoff=PT2H
booking.max-reschedules=2

management.endpoints.web.exposure.include=health,info